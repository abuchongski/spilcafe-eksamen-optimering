<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spilcafé</title>
  <link rel="stylesheet" href="docs/app.css" />
</head>

<body>
  
  <header>
    <img src="img/spilcafe_logo.png" alt="Spilcaféen Logo" class="Logo"/>
    <h1><span>Vores</span> <span>Spiloversigt</span></h1>
    <button id="open-booking" type="button" class="header-book-btn">
  Book bord
</button>
  </header>

  <main>
    <div class="controls">
      <div class="control-group">
        <label for="genre-select">Genre</label>
        <select id="genre-select">
          <option value="all">Genre</option>
        </select>
      </div>
      <div class="control-group">
  <label for="players-select">Antal spillere</label>
  <select id="players-select">
    <option value="all">Antal spillere</option>
  </select>
</div>

<div class="control-group">
  <label for="age-select">Alder</label>
  <select id="age-select">
    <option value="all">Alder</option>
  </select>
</div>

<div class="control-group">
  <label for="difficulty-select">Sværhedsgrad</label>
  <select id="difficulty-select">
    <option value="all">Sværhedsgrad</option>
    <option value="Let">Let</option>
    <option value="Mellem">Mellem</option>
    <option value="Svær">Svær</option>
  </select>
</div>

<div class="control-group">
  <label for="playtime-select">Spilletid</label>
  <select id="playtime-select">
    <option value="all">Spilletid</option>
    <option value="0-30">Op til 30 min.</option>
    <option value="31-60">31-60 min.</option>
    <option value="61-90">61-90 min.</option>
    <option value="91+">Over 90 min.</option>
  </select>
</div>
      <div class="control-group">
        <label for="sort-select">Sortering</label>
        <select id="sort-select">
          <option value="none">Sortering</option>
          <optgroup label="familie spil">
            <option value="title-asc">Titel (A–Å)</option>
            <option value="title-desc">Titel (Å–A)</option>
          </optgroup>
          <optgroup label="Rating">
            <option value="rating-desc">Rating (højeste først)</option>
            <option value="rating-asc">Rating (laveste først)</option>
          </optgroup>
          <optgroup label="Spilletid">
            <option value="playtime-asc">Spilletid (kortest først)</option>
            <option value="playtime-desc">Spilletid (længst først)</option>
          </optgroup>
          <optgroup label="Spillere">
            <option value="players-asc">Spillere (færrest først)</option>
            <option value="players-desc">Spillere (flest først)</option>
          </optgroup>
          <optgroup label="Alder">
            <option value="age-asc">Alder (lavest først)</option>
            <option value="age-desc">Alder (højest først)</option>
          </optgroup>
          <optgroup label="Anmeldelser">
            <option value="votes-desc">Anmeldelser (flest først)</option>
          </optgroup>
          <optgroup label="Sværhedsgrad">
            <option value="difficulty-asc">Sværhedsgrad (let først)</option>
            <option value="difficulty-desc">Sværhedsgrad (svær først)</option>
          </optgroup>
        </select>
      </div>

      <div class="control-group search-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <label for="search-input">Søg</label>
        <input type="text" id="search-input" placeholder="Søg efter titel..." />
    
      </div>
        <button id="reset-filters" type="button">Nulstil</button>
    </div>
    

    <div class="status-bar">
      <p id="movie-count">Viser 0 spil</p>
    </div>

    <div id="movie-list" class="movie-grid">
      <p class="loading">Indlæser spil...</p>
    </div>
  </main>

  <footer>
    <div class="footer-top">
      <div class="footer-brand">
        <img src="img/spilcafe_logo.png" alt="Spilcafé" class="footer-logo" />
        <div>
          <p class="footer-brand-name">Spil<span>Caféen</span></p>
          <p class="footer-tagline">Danmarks hyggeligste spilcafé</p>
        </div>
      </div>
      <div class="footer-social">
        <a href="#" class="social-icon" aria-label="TikTok">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/></svg>
        </a>
        <a href="#" class="social-icon" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="#" class="social-icon" aria-label="Facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
      </div>
    </div>

    <div class="footer-divider"></div>

    <div class="footer-bottom">
      <div class="footer-locations-row">
        <p class="footer-label">Lokationer</p>
        <nav class="footer-locations">
          <a href="#">Vestergade</a>
          <span class="footer-sep">·</span>
          <a href="#">Fredensgade</a>
          <span class="footer-sep">·</span>
          <a href="#">Aalborg</a>
          <span class="footer-sep">·</span>
          <a href="#">Kolding</a>
          <span class="footer-sep">·</span>
          <a href="#">Odense</a>
        </nav>
      </div>
      <p class="footer-copy">© 2024 Spilcaféen &nbsp;·&nbsp; <a href="#">Cookieindstillinger</a></p>
    </div>
  </footer>

  <dialog id="booking-dialog">
    <form id="booking-form" method="dialog">
      <button type="button" id="close-booking">✕</button>
      <div class="booking-header">
        <h2>Book et Bord</h2>
        <p>Reservér et bord hos Spilcaféen og vælg dit yndlingsspil</p>
      </div>
      <div class="booking-body">
        <div class="booking-row">
          <div class="booking-field">
            <label for="booking-name">Navn</label>
            <input type="text" id="booking-name" placeholder="Dit fulde navn" required />
          </div>
          <div class="booking-field">
            <label for="booking-email">E-mail</label>
            <input type="email" id="booking-email" placeholder="din@email.dk" required />
          </div>
        </div>
        <div class="booking-row">
          <div class="booking-field">
            <label for="booking-date">Dato</label>
            <input type="date" id="booking-date" required />
          </div>
          <div class="booking-field">
            <label for="booking-time">Tidspunkt</label>
            <select id="booking-time" required>
              <option value="">Vælg tid</option>
              <option value="14:00">14:00</option>
              <option value="15:00">15:00</option>
              <option value="16:00">16:00</option>
              <option value="17:00">17:00</option>
              <option value="18:00">18:00</option>
              <option value="19:00">19:00</option>
              <option value="20:00">20:00</option>
              <option value="21:00">21:00</option>
            </select>
          </div>
        </div>
        <div class="booking-row">
          <div class="booking-field">
            <label for="booking-people">Antal personer</label>
            <input type="number" id="booking-people" min="1" max="20" placeholder="Antal" required />
          </div>
          <div class="booking-field">
            <label for="booking-location">Lokation</label>
            <select id="booking-location" required>
              <option value="">Vælg lokation</option>
              <option value="Vestergade">Vestergade</option>
              <option value="Fredensgade">Fredensgade</option>
              <option value="Aalborg">Aalborg</option>
              <option value="Kolding">Kolding</option>
              <option value="Odense">Odense</option>
            </select>
          </div>
        </div>
        <div class="booking-field">
          <label for="booking-note">Ønsker / Bemærkninger <span class="optional">(valgfri)</span></label>
          <textarea id="booking-note" placeholder="F.eks. ønsket spil, fødselsdagsfejring, allergi..."></textarea>
        </div>
        <button type="submit" class="booking-submit">Bekræft Booking</button>
      </div>
    </form>
  </dialog>

  <dialog id="movie-dialog">
    <form method="dialog">
      <button id="close-dialog">✕</button>
      <div id="dialog-content"></div>
    </form>
  </dialog>
<button id="back-to-top" type="button" aria-label="Tilbage til toppen">
  ↑
</button>
  <script src="docs/app.js"></script>
  
</body>
</html>
